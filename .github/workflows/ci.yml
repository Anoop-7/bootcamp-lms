name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-typecheck:
    name: Backend Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bootcamp?schema=public"
        run: npx prisma generate

      - name: Run TypeScript Check
        run: npx tsc --noEmit

      - name: Run Test TypeScript Check
        run: npx tsc --noEmit --project tests/tsconfig.json

      - name: Run Automated Test Suite
        env:
          NODE_ENV: test
          JWT_SECRET: "test-environment-jwt-secret-minimum-32-chars-long"
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bootcamp?schema=public"
          AWS_REGION: "ap-south-1"
          AWS_S3_BUCKET: "test-bucket"
          CLOUDFRONT_DOMAIN: "https://test.cloudfront.net"
          PAYMENTS_MODE: "razorpay"
          RAZORPAY_KEY_ID: "rzp_test_dummy_id"
          RAZORPAY_KEY_SECRET: "rzp_test_dummy_secret"
        run: npm test

  frontend-lint-and-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vite Build
        run: npm run build